<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ching Chong Sushi</title>
        <link rel="icon" type="image/png" href="../imgs/chingchong.jpeg">
        <link rel="stylesheet" href="menu.css">
        <link href="https://fonts.googleapis.com/css?family=Germania One" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="cozinha_header">
                <div class="flex-item">
                    <img id="logo" src="../imgs/chingchong.jpeg">
                    <h1> CHING CHONG SUSHI</h1>
                </div>
                <div class="flex-item center-item">
                    <h2 id="cozinha"> ~Cozinha~ </h2>
                </div>
                <div class="flex-item right-item">
                    <a class="voltar" href="paineladm.html"> Voltar </a>
                </div>
            </div>
        </header>
        <hr>
            <main class="ei_main">
            <h1 id="pedidos-recebidos"> ~Pedidos Recebidos~ </h1>
            <section id="lista-pedios">
                <!-- CARDs -->
            </section>
            
            <div class="ei_card_imagem">
            <img src="../back-end/src/uploads/${item.imagem}" alt="${item.nome}">
            </div>

            <!-- Card -->
            <article class="ei_card">
                <div class="ei_card_informacoes">
                    <h2 class="item_pedido"> Temaki </h2>

                    <p class="quantidade_pedido"> Quantidade: 10 </p>

                    <p class="mesa_pedido"> Mesa: 67</p>
                </div>
            </article>
        </main>
        <script type="module" src="../scripts/auth.js"></script>
    </body> 
</html>
