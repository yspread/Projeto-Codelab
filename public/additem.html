<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Adicionar Item</title>
    <link rel="icon" type="image/png" href="../imgs/chingchong.jpeg" />
    <link rel="stylesheet" href="menu.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Germania One"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
            <div class="cozinha_header">
                <div class="flex-item">
                    <img id="logo" src="../imgs/chingchong.jpeg">
                    <h1> CHING CHONG SUSHI</h1>
                </div>
                <div class="flex-item center-item">
                    <h2 id="cozinha"> ~Adicionar Item~ </h2>
                </div>
                <div class="flex-item right-item">
                    <a class="voltar" href="paineladm.html"> Voltar </a>
                </div>
            </div>
    </header>
    <hr>
    <main>
      <div class="ai_main">
        <h1>Adicionar Item</h1>

        <form class="ai_forms" id="form-adicionar-item" enctype="multipart/form-data">
          <div class="ai_campo">
            <label for="nome">Nome do Item</label>
            <input
              type="text"
              name="nome"
              id="nome"
              placeholder="Ex: temaki de salmão"
            />
          </div>

          <div class="ai_campo">
            <label for="descrição">Descrição</label>
            <textarea
              name="descrição"
              id="descricao"
              placeholder="Ex: feito de salmão"
            ></textarea>
          </div>

          <div class="ai_campo">
            <label for="preço">Preço</label
            ><input
              type="number"
              name="preço"
              id="preco"
              step="0.01"
              placeholder="R$0,00"
            />
          </div>

          <div class="ai_campo">
            <label for="categoria">Categoria</label>
            <select name="categoria" id="categoria">
              <option value="">Selecione uma categoria</option>
              <option value="destaques">Destaques</option> 
              <option value="carpaccios">Carpaccios</option>
              <option value="sushis">Sushi</option>
              <option value="sashimis">Sashimis</option>
              <option value="temakis">Temakis</option>
              <option value="fritos">Fritos</option>
              <option value="sobremesas">Sobremesas</option> 
              <option value="bebidas">Bebidas</option>             
            </select>
          </div>

          <div class="ai_campo">
            <label for="imagem">Imagem</label>
            <input type="file" name="imagem" id="imagem" accept="image/*" />
          </div>

          <div class="ai_botao">
            <button type="submit">Adicionar Item</button>
          </div>
        </form>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../scripts/addItem.js"></script>
    <script type="module" src="../scripts/auth.js"></script>
  </body>
</html>
