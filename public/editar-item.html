<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Editar Item</title>

        <link rel="icon" type="image/png" href="../imgs/chingchong.jpeg">
        <link rel="stylesheet" href="menu.css">
        <link href="https://fonts.googleapis.com/css?family=Germania+One" rel="stylesheet">
    </head>

    <body>
        <header>
            <div class="cozinha_header">
                <div class="flex-item">
                    <img id="logo" src="../imgs/chingchong.jpeg">
                    <h1> CHING CHONG SUSHI</h1>
                </div>
                <div class="flex-item center-item">
                    <h2 id="cozinha"> ~Editar Item~ </h2>
                </div>
                <div class="flex-item right-item">
                    <a class="voltar" href="gerenciaritem.html"> Voltar </a>
                </div>
            </div>
        </header>
        <hr>
        <main>
            <div class="ai_main">
                <h1>Editar Item</h1>

                <form class="ai_forms" id="form-editar-item">
                    <div class="ai_campo">
                        <label for="nome">Nome do item</label>

                        <input
                            type="text"
                            name="nome"
                            id="nome"
                            required
                        >
                    </div>

                    <div class="ai_campo">
                        <label for="descricao">Descrição</label>

                        <textarea
                            name="descricao"
                            id="descricao"
                            required
                        ></textarea>
                    </div>

                    <div class="ai_campo">
                        <label for="preco">Preço</label>

                        <input
                            type="number"
                            name="preco"
                            id="preco"
                            value=""
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="ai_campo">
                        <label for="categoria">Categoria</label>

                        <select name="categoria" id="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="destaques">Destaques</option> 
                            <option value="carpaccios">Carpaccios</option>
                            <option value="sushis">Sushi</option>
                            <option value="sashimis">Sashimis</option>
                            <option value="temakis">Temakis</option>
                            <option value="fritos">Fritos</option>
                            <option value="sobremesas">Sobremesas</option> 
                            <option value="bebidas">Bebidas</option>       
                        </select>
                    </div>

                    <div class="ai_campo">
                        <label>Imagem atual</label>
                        <img
                            class="ai_imagem_atual"
                            id="img-atual"
                        >
                    </div>

                    <div class="ai_campo">
                        <label for="imagem">Trocar imagem</label>

                        <input
                            type="file"
                            name="imagem"
                            id="imagem"
                            accept="image/*"
                        >
                    </div>

                    <div class="ai_botao">
                        <button type="submit">Salvar alterações</button>
                    </div>
                </form>
            </div>
        </main>
        <script type="module" src="../scripts/auth.js"></script>
        <script type="module" src="../scripts/editItem.js"></script>
    </body>
</html>
