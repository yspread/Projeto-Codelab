<!doctype html>
<html>
  <head>

    <link rel="icon" type="image/png" href="../imgs/chingchong.jpeg" />
    <link rel="stylesheet" href="menu.css" />
    <link

      rel="stylesheet"
    />
  </head>
  <body>
    <header class="pa_header">
      <div class="pa_header_logo">
        <img src="../imgs/chingchong.jpeg" alt="Logo" />

      </div>

      <div class="pa_header_titulo">

      <div class="pa_header_sair">

    <main class="ei_main">
      <section class="ei_busca">
        <label for="buscar-item">Buscar item</label>

        <input
          type="text"
          id="buscar-item"
          placeholder="Digite o nome do item"
        />
      </section>

      <section class="ei_lista" id="lista-itens"></section>
    </main>
    <script type="module" src="../scripts/auth.js"></script>
    <script type="module" src="../scripts/painel.js"></script>
